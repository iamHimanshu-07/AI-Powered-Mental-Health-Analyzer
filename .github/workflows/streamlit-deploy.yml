# ============================================================================
# Streamlit Community Cloud — auto-redeploy on push to main
# ----------------------------------------------------------------------------
# Streamlit Community Cloud watches the repo on its own, but it has a
# short debounce (and sometimes a long one) and won't necessarily pick up
# a fresh commit instantly. Hitting the per-app "deploy webhook" from a
# GitHub Action guarantees a rebuild within seconds of every push.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   STREAMLIT_DEPLOY_URL   — the per-app deploy webhook URL. To find it:
#     1. Open share.streamlit.io → your app → "⋮" menu → "Deploy this app"
#     2. Copy the URL it gives you (looks like:
#        https://share.streamlit.io/deploy/<app_id>/<branch>/<main_file>)
#     3. Save that URL in the repo secret `STREAMLIT_DEPLOY_URL`.
#
# Optional:
#   - To keep the secret out of the run logs, this workflow only logs a
#     short prefix (host + first path segment), never the full URL.
# ============================================================================

name: Redeploy to Streamlit Community Cloud

on:
  push:
    branches: [main]
    # Skip the auto-redeploy for doc-only / cosmetic changes if you want:
    # paths-ignore:
    #   - "README.md"
    #   - "**.md"
  workflow_dispatch:  # allow manual trigger from the Actions tab

# Don't waste a runner on forks (and the secret isn't available there
# anyway). Only run on the default branch of the upstream repo.
concurrency:
  group: streamlit-redeploy
  cancel-in-progress: true

jobs:
  redeploy:
    name: Ping Streamlit Cloud
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'iamHimanshu-07/MindPulse.AI'
    timeout-minutes: 5

    steps:
      - name: Checkout (sanity, also gives us a clean tree)
        uses: actions/checkout@v4

      - name: Validate required files are present
        run: |
          set -e
          for f in app/app.py requirements.txt runtime.txt packages.txt .streamlit/config.toml app/models/fetch_model.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file missing: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Verify Python syntax of the deployed modules
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse-check app.py and fetch_model.py
        run: |
          python - <<'PY'
          import ast
          for p in ("app/app.py", "app/models/fetch_model.py"):
              ast.parse(open(p, encoding="utf-8").read())
              print(f"OK  {p}")
          PY

      - name: Ping Streamlit Community Cloud deploy webhook
        env:
          DEPLOY_URL: ${{ secrets.STREAMLIT_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::STREAMLIT_DEPLOY_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Log only the host + first 2 path segments so we don't leak
          # the deploy token into run output.
          MASKED=$(echo "$DEPLOY_URL" | awk -F/ '{print $1"//"$3"/"$4"/"$5"/"$6"/"$7}')
          echo "Pinging Streamlit Cloud: $MASKED"
          # -L follows redirects (Cloud returns 307 → /deploy).
          # -f fails the step on non-2xx. -s silences progress bars.
          curl -fsSL -X POST "$DEPLOY_URL" \
            -H "User-Agent: github-actions/MindPulse.AI" \
            -o /tmp/streamlit-response.txt -w "HTTP %{http_code}\n"
          echo "--- response (first 400 bytes) ---"
          head -c 400 /tmp/streamlit-response.txt || true
          echo
          echo "Redeploy ping sent. The app will rebuild on share.streamlit.io within ~30s."
